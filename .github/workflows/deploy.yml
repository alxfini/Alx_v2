name: Deploy FTP
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
        
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Instala o motor para rodar o build
          
      - name: Instalar dependências
        run: npm install
        
      - name: Fazer o Build do projeto
        run: npm run build
        
      - name: Enviar arquivos via FTP para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/ # Pega apenas a pasta já compilada
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
